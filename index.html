<!doctype html>
<!-- La única página HTML de la app. React dibuja todas las pantallas dentro de #root. -->
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Calcifer</title>
    <!-- Instalación en la pantalla de inicio: el manifest (Android y Chrome) y las etiquetas
         de Apple (iPad y iPhone). Los colores repiten los de global.css: aquí no se pueden
         usar variables de CSS. -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#FBF7F0" />
    <link rel="icon" href="/icons/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Calcifer" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
